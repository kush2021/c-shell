name: Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck
      - name: Run cppcheck
        run: cppcheck --error-exitcode=1 --enable=warning,performance,portability .
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y clang-format-19
      - name: Run clang-format
        run: |
          find . -name "*.[ch]" | xargs clang-format-19 --dry-run --Werror

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: sudo apt-get install -y clang-tidy bear
      - name: Generate Compile Commands
        run: bear -- make CC=clang CFLAGS="-std=c17 -Wall -Wextra -Wpedantic -Werror -Wshadow -Wunreachable-code"
      - name: Strip sanitizer flags from compile commands
        run: |
          jq '[ .[] | .command |= (gsub("-fsanitize=\\S+"; "") | gsub("-Og"; "")) ]' \
            compile_commands.json > compile_commands_ci.json
          mv compile_commands_ci.json compile_commands.json
      - name: Run clang-tidy
        run: |
          if [ ! -f compile_commands.json ]; then
            echo "Error: compile_commands.json not found in the repository root."
            echo "Please generate compile_commands.json with your build system before running clang-tidy."
            exit 1
          fi
          find . -name "*.c" | xargs clang-tidy --warnings-as-errors="*" -p .
